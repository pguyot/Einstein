name: CI macOS (FLTK)

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Get dependencies
      run: brew install clang-format
    - name: Get sources
      uses: actions/checkout@v7
    - name: Configure Einstein
      run: |
        cmake -S . -B _Build_/Makefiles -D EINSTEIN_BUILD_FLUID=OFF -D CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
    - name: Check format
      run: |
        cmake --build _Build_/Makefiles --target clang-format-check
    - name: Compile Einstein
      run: |
        cmake --build _Build_/Makefiles --target Einstein
    - name: Archive
      if: github.event_name != 'pull_request'
      run: |
        mkdir -p artifacts
        tar czf artifacts/Einstein-macOS-FLTK.app.tgz -C _Build_/Makefiles Einstein.app
    - name: Upload Artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: Einstein-macOS-FLTK
        path: artifacts/Einstein-macOS-FLTK.app.tgz
