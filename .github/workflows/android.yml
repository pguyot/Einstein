name: CI Android (SDL)

on:
  workflow_dispatch:

env:
  SDL_VERSION: 3.2.16

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download prebuilt SDL3 for Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh -R libsdl-org/SDL release download "release-${SDL_VERSION}" \
            -p "SDL3-devel-${SDL_VERSION}-android.zip" -D /tmp
          unzip -o -j "/tmp/SDL3-devel-${SDL_VERSION}-android.zip" '*.aar' -d android-project/app/libs

      - name: Build debug APK (arm64)
        working-directory: android-project
        run: ./gradlew --no-daemon assembleDebug -PeinsteinAbis=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Einstein-android-arm64
          path: android-project/app/build/outputs/apk/debug/*.apk
