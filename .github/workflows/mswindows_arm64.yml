name: CI Windows ARM64 (FLTK)

on:
  workflow_dispatch:
#on:
#  push:
#    branches: [ master ]
#  pull_request:
#    branches: [ master ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Get sources
      uses: actions/checkout@v7
    - name: Configure
      run: |
        cmake -S . -B _Build_/Makefiles -D EINSTEIN_BUILD_FLUID=OFF -A ARM64 -D CMAKE_BUILD_TYPE=Release
    - name: Compile Einstein
      run: |
        cmake --build _Build_/Makefiles --config Release --target Einstein
    - name: Upload Artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: Einstein-Windows-ARM64-FLTK
        path: _Build_/Makefiles/Release/Einstein.exe
