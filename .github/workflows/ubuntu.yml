name: CI Ubuntu

on:
  workflow_dispatch:
#on:
#  push:
#    branches: [ master ]
#  pull_request:
#    branches: [ master ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Get dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpulse-dev ninja-build libbsd-dev clang-format
        # FLTK dependencies:
        sudo apt-get install -y libx11-dev libglu1-mesa-dev libxft-dev libxcursor-dev \
          libasound2-dev freeglut3-dev libcairo2-dev libfontconfig1-dev libglew-dev \
          libjpeg-dev libpng-dev libxinerama-dev
        # FLTK Wayland dependencies:
        sudo apt-get install -y libpango1.0-dev libwayland-dev wayland-protocols \
          libxkbcommon-dev libdbus-1-dev libdecor-0-dev libgtk-3-dev
    - name: Get sources
      uses: actions/checkout@v4
    - name: Configure Einstein
      run: |
        cmake -S . -B _Build_/Makefiles -D EINSTEIN_BUILD_FLUID=OFF
    - name: Check format
      run: |
        cmake --build _Build_/Makefiles --target clang-format-check
    - name: Compile Einstein
      run: |
        cmake --build _Build_/Makefiles --target Einstein
