name: CI Ubuntu (SDL)

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Get dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config ninja-build libbsd-dev
        # SDL3 dependencies:
        sudo apt-get install -y libasound2-dev libpulse-dev libpipewire-0.3-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
          libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev libibus-1.0-dev \
          libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev libudev-dev
    - name: Get sources
      uses: actions/checkout@v7
    - name: Configure Einstein
      run: |
        cmake -S . -B _Build_/SDL -G Ninja -D CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -D EINSTEIN_FLTK_FRONTEND=OFF -D EINSTEIN_SDL3_FRONTEND=ON
    - name: Compile Einstein
      run: |
        cmake --build _Build_/SDL --target Einstein
    - name: Archive
      if: github.event_name != 'pull_request'
      run: |
        mkdir -p artifacts
        tar czf artifacts/Einstein-Ubuntu-SDL.tgz -C _Build_/SDL Einstein
    - name: Upload Artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: Einstein-Ubuntu-SDL
        path: artifacts/Einstein-Ubuntu-SDL.tgz
